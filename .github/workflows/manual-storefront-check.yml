name: Manual storefront browser check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out monitoring repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run storefront browser check
        id: check
        continue-on-error: true
        run: node monitor.cjs

      - name: Upload screenshots and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-check-evidence
          path: monitor-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Report script failures
        if: steps.check.outcome == 'failure'
        run: |
          echo "Browser check encountered a failure; review the evidence artifact."
          exit 1
